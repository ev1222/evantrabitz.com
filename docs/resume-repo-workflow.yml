# Copy this file into the private LaTeX repo ev1222/resume as
# .github/workflows/publish-cv.yml.
#
# On every push that touches the resume source, it compiles the PDF and commits
# it to this site repo as public/cv.pdf. That commit triggers a normal
# Workers Builds deploy, so the site build itself never needs TeX.
#
# The resume repo being private is fine: its own checkout uses the built-in
# GITHUB_TOKEN, and the only cross-repo access is the write to the site repo.
# Nothing from the resume repo reaches the site except the compiled PDF.
#
# Auth is a GitHub App, not a PAT: each run mints an installation token that
# expires after an hour and can only write to evantrabitz.com. The commit is
# made through the GraphQL API (createCommitOnBranch), so GitHub signs it as
# the App. It shows as "Verified" and passes a "require signed commits" rule.
#
# One-time setup:
#   1. github.com/settings/apps/new
#        - Name: e.g. "ev1222-cv-publisher"; Homepage URL: https://evantrabitz.com
#        - Webhook: uncheck "Active"
#        - Repository permissions: Contents → Read and write (nothing else)
#        - Where can this app be installed: Only on this account
#   2. On the App's page: note the App ID, then "Generate a private key" (.pem).
#   3. "Install App" → ev1222 → Only select repositories → evantrabitz.com.
#   4. In ev1222/resume → Settings → Secrets and variables → Actions:
#        - Variable CV_APP_ID          = the App ID
#        - Secret   CV_APP_PRIVATE_KEY = the full contents of the .pem
#      Then delete the local .pem.

name: Publish CV

on:
  push:
    branches: [main]
    paths: ['**.tex', '**.cls', '**.sty', '**.bib', '.github/workflows/publish-cv.yml']
  workflow_dispatch:

# Serialize runs: each commit is made against the site's current HEAD.
concurrency:
  group: publish-cv
  cancel-in-progress: false

permissions:
  contents: read

env:
  ROOT_FILE: resume.tex
  SITE_REPO: ev1222/evantrabitz.com
  SITE_BRANCH: main
  SITE_PATH: public/cv.pdf

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ env.ROOT_FILE }}
          # Switch to e.g. `latexmk -xelatex` via `latexmk_use_xelatex: true` if the resume uses fontspec.

      - name: Keep the PDF as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: ${{ github.workspace }}/*.pdf

      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CV_APP_ID }}
          private-key: ${{ secrets.CV_APP_PRIVATE_KEY }}
          owner: ev1222
          repositories: evantrabitz.com

      - name: Commit cv.pdf to the site (signed by the App)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pdf="${ROOT_FILE%.tex}.pdf"

          # Skip if the site already has this exact file (git blob hashes match).
          current=$(gh api "repos/$SITE_REPO/contents/$SITE_PATH?ref=$SITE_BRANCH" --jq .sha 2>/dev/null || true)
          if [ "$current" = "$(git hash-object "$pdf")" ]; then
            echo "cv.pdf unchanged"
            exit 0
          fi

          head=$(gh api "repos/$SITE_REPO/commits/$SITE_BRANCH" --jq .sha)
          base64 -w0 "$pdf" > "$RUNNER_TEMP/cv.b64"

          jq -n \
            --arg repo "$SITE_REPO" \
            --arg branch "$SITE_BRANCH" \
            --arg path "$SITE_PATH" \
            --arg head "$head" \
            --arg msg "Update CV (resume@${GITHUB_SHA::7})" \
            --rawfile contents "$RUNNER_TEMP/cv.b64" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: $msg },
                fileChanges: { additions: [ { path: $path, contents: $contents } ] }
              } }
            }' > "$RUNNER_TEMP/body.json"

          gh api graphql --input "$RUNNER_TEMP/body.json" --jq '.data.createCommitOnBranch.commit.url'
